spring.config.import=optional:classpath:application-local.properties
spring.application.name=medical-shop
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_shop}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# JWT configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000
# Initial administrator bootstrap
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}